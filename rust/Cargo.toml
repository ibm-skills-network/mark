[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
mark-platform = { path = "crates/platform" }
mark-learner = { path = "crates/learner" }
mark-ops = { path = "crates/ops" }

anyhow = "1.0.104"
async-trait = "0.1.89"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
form_urlencoded = "1.2.2"
axum = { version = "0.8.9", default-features = false, features = ["json", "http1", "tokio"] }
base64 = "0.22.1"
http = "1.5.0"
rand = "0.10.3"
regex = "1.13.1"
# rustls with ring (already in the tree through sqlx); no native TLS, no
# aws-lc build requirements in the image.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout", "limit", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.28.0", features = ["v4"] }

# dev
http-body-util = "0.1.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
