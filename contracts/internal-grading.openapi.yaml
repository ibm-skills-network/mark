openapi: 3.1.0
info:
  title: Mark internal grading queue routes
  version: 1.0.0
  description: |
    Service-to-service routes on the TypeScript API (`apps/api`) that let
    another in-cluster backend hand a learner submit to the grading queue
    without owning the Redis job state or BullMQ. The caller (the Rust API
    serving `PATCH /api/v2/assignments/{a}/attempts/{t}`) has already done
    every submit check: session, ownership, group link, open/deadline,
    served and duplicate ids, unsupported response types, file references,
    `requireAllQuestions` and the tier decision. These routes re-check only
    the request shape and the AI grading kill switch.

    Authentication: every request carries `x-job-queue-secret` with the
    shared job-queue secret (`JOB_QUEUE_SECRET`, the same value the API and
    the worker use to encrypt job payloads). It is compared in constant
    time before the body or query is looked at; a missing or wrong value is
    403 and the denial is logged without the value. There is no session
    header and no role check. The routes are not path-restricted at the
    api-gateway: they are unreachable from outside only because the secret
    is never given to browsers. Never forward a learner's request here.

    Base URL: `MARK_INTERNAL_API_URL` (in-cluster, e.g.
    `http://mark-api:80`) followed by the paths below, which include the
    API's global `/api` prefix and are not versioned.

    Bodies are plain JSON: no base64 in either direction. Integer ids are
    JSON integers within the signed 32-bit range. Unknown keys in the
    request body are stripped, at the top level and inside `updateDto`.

    Errors use the Nest shape `{statusCode, message, error?}` plus `code`
    where noted. A 400 `message` from shape validation is a list of
    strings; its wording is not part of the contract.

servers:
  - url: /api

components:
  securitySchemes:
    jobQueueSecret:
      type: apiKey
      in: header
      name: x-job-queue-secret
      description: The shared job-queue secret. Only the first value of a repeated header is read.

  headers:
    RetryAfter:
      schema: { type: string, enum: ["1"] }

  schemas:
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        message:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        error: { type: string }
        code:
          type: string
          enum: [AI_TEMPORARILY_DISABLED]
      additionalProperties: true

    QueuedTier:
      type: string
      enum: [standard, heavy]
      description: |
        `heavy` when the attempt's pinned assignment version has an UPLOAD
        or LINK_FILE question (queue `mark.attempt.heavy`); otherwise
        `standard` (queue `mark.attempt`). Inline-tier attempts are graded
        by the caller and never enqueued.

    EnqueueRequest:
      type: object
      required:
        - assignmentId
        - attemptId
        - userId
        - gradingCallbackRequired
        - submissionReceivedAt
        - tier
        - updateDto
      properties:
        assignmentId: { type: integer, minimum: 1, maximum: 2147483647 }
        attemptId: { type: integer, minimum: 1, maximum: 2147483647 }
        userId:
          type: string
          minLength: 1
          maxLength: 320
          description: The session's `userId` (the learner's email).
        gradingCallbackRequired:
          type: boolean
          description: The session's `gradingCallbackRequired` (false when absent).
        authCookie:
          type: string
          maxLength: 16384
          description: |
            The learner's `authentication` cookie value. Forwarded to the
            worker for the LTI grade passback only when
            `gradingCallbackRequired` is true; omit it otherwise.
        submissionReceivedAt:
          type: string
          format: date-time
          description: |
            When the caller received the submit (taken first in the
            handler), ISO-8601 with milliseconds and `Z`. The worker judges
            the deadline against this, not against the queue drain time.
        tier: { $ref: "#/components/schemas/QueuedTier" }
        updateDto:
          description: |
            The learner's submit body as accepted by the caller, with
            `learnerTextResponse`, `learnerChoices[]` and
            `learnerFileResponse[].content` already base64-decoded. Same
            schema and limits as `SubmitRequest`. The author-preview fields
            `authorQuestions`, `authorAssignmentDetails`,
            `preTranslatedQuestions` and `expiresAt` are refused (400).
          $ref: "./learner-submit.openapi.yaml#/components/schemas/SubmitRequest"
      description: Unknown keys are stripped, not refused.

    EnqueueResponse:
      type: object
      required: [gradingJobId, reused, message]
      properties:
        gradingJobId: { type: string, format: uuid }
        reused:
          type: boolean
          description: |
            True when a grading job for this (userId, assignmentId,
            attemptId) was already in flight; that job's id is returned and
            this request's payload is dropped.
        message:
          type: string
          description: |
            The message the learner PATCH returns with the job id, verbatim:
            new job "Grading job created. Use the SSE endpoint to track
            progress."; reused job "A grading job is already running for this
            attempt. Reusing existing job."
          enum:
            - Grading job created. Use the SSE endpoint to track progress.
            - A grading job is already running for this attempt. Reusing existing job.
      additionalProperties: false

    ActiveJobResponse:
      type: object
      required: [gradingJobId]
      properties:
        gradingJobId:
          type: [string, "null"]
          format: uuid
          description: The in-flight (Pending or Processing) grading job, or null.
      additionalProperties: false

  responses:
    BadRequest:
      description: Body or query fails validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            {
              "statusCode": 400,
              "message": ["attemptId must be an integer number"],
              "error": "Bad Request",
            }
    Forbidden:
      description: Missing or wrong `x-job-queue-secret`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            {
              "statusCode": 403,
              "message": "Invalid job queue secret",
              "error": "Forbidden",
            }
    InternalError:
      description: Redis or queue failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { "statusCode": 500, "message": "Internal server error" }
    Unavailable:
      description: The database connection dropped mid-request; retry after the header.
      headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            { "statusCode": 503, "message": "Service temporarily unavailable" }

security:
  - jobQueueSecret: []

paths:
  /internal/grading/enqueue:
    post:
      operationId: enqueueLearnerGrading
      summary: Queue a learner submit for AI grading.
      description: |
        1. AI grading kill switch for the assignment
           (`GradingKillSwitchService.assertGradingAllowed(assignmentId,
           userId, "submit")`): when grading is off and the assignment has an
           AI-graded question -> 409, nothing is created.
        2. Acquire the in-flight lock for (userId, assignmentId, attemptId).
           Held -> 200 with that job's id and `reused: true`.
        3. Otherwise create the job state (Pending) and add the
           `attempt.grade` BullMQ job on the tier's queue with the encrypted
           payload `{assignmentId, attemptId, gradingJobId, updateDto,
           submissionReceivedAt, userSession: {userId, role: "learner",
           gradingCallbackRequired}, authCookie?}`.
        4. If adding the job fails, the job state is set to Failed
           ("Failed to enqueue grading job: <reason>"), the in-flight lock is
           released, and the response is 500.

        Nothing is written to Postgres: the attempt stays `submitted=false`
        until the worker commits. A retried call after a 500 creates a new
        job; a retried call after a 200 returns the same job with
        `reused: true` while it is in flight.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnqueueRequest" }
      responses:
        "200":
          description: Job created or reused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnqueueResponse" }
              example:
                {
                  "gradingJobId": "0b6d0f3c-9a0e-4a5c-9d0e-1f2a3b4c5d6e",
                  "reused": false,
                  "message": "Grading job created. Use the SSE endpoint to track progress.",
                }
        "400":
          description: |
            The payload was refused. The caller validated it already, so
            this means the two sides disagree on the contract: the caller
            logs it as an error and passes the body through to the learner
            unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            AI grading is switched off for this assignment. Pass the body
            through to the learner unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  "statusCode": 409,
                  "code": "AI_TEMPORARILY_DISABLED",
                  "message": "This activity is temporarily out of service. Please try again later.",
                }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /internal/grading/active-job:
    get:
      operationId: findActiveLearnerGradingJob
      summary: The in-flight grading job for one learner attempt, if any.
      description: |
        Reads the in-flight lock for (userId, assignmentId, attemptId).
        A pointer to a job that has finished, failed or expired is cleared
        and reported as null. Read-only otherwise.
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 320 }
        - name: assignmentId
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
        - name: attemptId
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        "200":
          description: The in-flight job id, or null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveJobResponse" }
              examples:
                inFlight:
                  value:
                    { "gradingJobId": "0b6d0f3c-9a0e-4a5c-9d0e-1f2a3b4c5d6e" }
                none:
                  value: { "gradingJobId": null }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
