name: Build All Services

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
    paths:
      - "apps/api-gateway/**"
      - "apps/api/**"
      - "apps/jobs/**"
      - "apps/web/**"
      - "docs/insomnia/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/build-images.yml"
  pull_request:
    branches:
      - master
  schedule:
    - cron: 0 5 * * *
  workflow_dispatch:
    inputs:
      suffix:
        description: Custom suffix for tag
        required: false
      insomnia_environment:
        description: Insomnia environment to test for the job microservice
        required: false
        default: staging
  repository_dispatch:

jobs:
  security-scan:
    name: Security Scan - ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        service: [api-gateway, api, jobs, web]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if service needs scanning
        # `id` is `changes` (not `scan-changes`) so every downstream
        # `if: steps.changes.outputs.needs_scan == 'true'` actually resolves.
        # The previous `scan-changes` id made every gated step in this job
        # silently skip (the property was undefined → `'' == 'true'` = false).
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "needs_scan=true" >> $GITHUB_OUTPUT
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            elif [[ -z "${{ github.event.before }}" || "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-parse origin/master)"
            else
              BASE_SHA="${{ github.event.before }}"
            fi
            if git diff --name-only "$BASE_SHA"...${{ github.sha }} | grep -E "(^apps/${{ matrix.service }}/|^package\.json|^yarn\.lock|^turbo\.json|^\.github/workflows/)"; then
              echo "needs_scan=true" >> $GITHUB_OUTPUT
            else
              echo "needs_scan=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Free disk space
        if: steps.changes.outputs.needs_scan == 'true'
        run: |
          echo "Disk usage before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true

          docker system prune -af || true
          docker volume prune -f || true

          echo "Disk usage after cleanup:"
          df -h

      - name: Setup Node.js
        if: steps.changes.outputs.needs_scan == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "yarn"

      - name: Configure Yarn
        if: steps.changes.outputs.needs_scan == 'true'
        run: |
          yarn config set network-timeout 600000

      - name: Install dependencies
        if: steps.changes.outputs.needs_scan == 'true'
        run: yarn install --frozen-lockfile
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
          HUSKY: 0
        timeout-minutes: 15

      - name: Run filesystem security scan
        if: steps.changes.outputs.needs_scan == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "apps/${{ matrix.service }}"
          format: "sarif"
          output: "trivy-fs-${{ matrix.service }}.sarif"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
        continue-on-error: true

      - name: Run dependency security audit
        if: steps.changes.outputs.needs_scan == 'true'
        run: |
          echo "🔍 DEPENDENCY SECURITY AUDIT FOR ${{ matrix.service }}"
          echo "==============================================="

          # Generate comprehensive JSON report (all dependencies, all severity levels)
          yarn audit --json > yarn-audit-${{ matrix.service }}-full.json || true
          yarn audit --groups dependencies --level info --json > yarn-audit-${{ matrix.service }}.json || true

          # Display human-readable report directly in workflow (show ALL vulnerabilities)
          echo "📊 VULNERABILITY SUMMARY (ALL SEVERITIES):"
          echo "--- ALL DEPENDENCIES (including dev) ---"
          yarn audit || true
          echo ""
          echo "--- PRODUCTION DEPENDENCIES ONLY ---"
          yarn audit --groups dependencies --level info || true

          echo ""
          echo "📄 Reports saved:"
          echo "  - yarn-audit-${{ matrix.service }}-full.json (all deps, all severities)"
          echo "  - yarn-audit-${{ matrix.service }}.json (prod deps, all severities)"
        continue-on-error: true

      - name: Run detect-secrets scan
        if: steps.changes.outputs.needs_scan == 'true'
        run: |
          echo "🔍 SECRETS DETECTION SCAN"
          echo "========================"

          pip install git+https://github.com/IBM/detect-secrets.git@0.13.1+ibm.64.dss

          # Run scan and show results
          echo "🔎 Scanning for potential secrets..."
          detect-secrets scan --update .secrets.baseline

          # Display baseline file if it exists
          if [ -f ".secrets.baseline" ]; then
            echo "📊 SECRETS BASELINE SUMMARY:"
            echo "Total potential secrets found: $(jq '.results | to_entries | length' .secrets.baseline)"
            
            # Show files with potential secrets
            echo "📁 Files with potential secrets:"
            jq -r '.results | keys[]' .secrets.baseline | head -10
            
            if [ "$(jq '.results | to_entries | length' .secrets.baseline)" -gt 10 ]; then
              echo "... and more (check .secrets.baseline for full list)"
            fi
          else
            echo "✅ No potential secrets detected"
          fi
        continue-on-error: true

      - name: Check if SARIF file exists
        if: always() && steps.changes.outputs.needs_scan == 'true'
        id: sarif-check
        run: |
          if [ -f "trivy-fs-${{ matrix.service }}.sarif" ]; then
            echo "sarif_exists=true" >> $GITHUB_OUTPUT
          else
            echo "sarif_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ SARIF file trivy-fs-${{ matrix.service }}.sarif not found"
          fi

      - name: Upload filesystem scan results
        if: always() && steps.changes.outputs.needs_scan == 'true' && steps.sarif-check.outputs.sarif_exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-fs-${{ matrix.service }}.sarif"
          category: trivy-fs-${{ matrix.service }}

      - name: Upload security reports as artifacts
        if: always() && steps.changes.outputs.needs_scan == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ matrix.service }}-${{ github.run_number }}
          path: |
            trivy-fs-${{ matrix.service }}.sarif
            yarn-audit-${{ matrix.service }}.json
            yarn-audit-${{ matrix.service }}-full.json
            .secrets.baseline
          retention-days: 30

  lint:
    name: Lint - ${{ matrix.service }}
    runs-on: ubuntu-latest
    # Skip lint on tagged releases — tags are produced from already-merged
    # code that passed lint on its PR. Tests still run on tags as a real
    # correctness gate; lint is style-only and runs identically anywhere.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    strategy:
      matrix:
        service: [api-gateway, api, jobs, web]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if service needs linting
        id: changes
        run: |
          # Check if this is a scheduled run, tag, or if service files changed
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "needs_build=true" >> $GITHUB_OUTPUT
          else
            # Resolve base SHA per event type. `github.event.before` only exists
            # on push events; pull_request events expand it to empty, which made
            # the diff a no-op and silently skipped every job on every PR.
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            elif [[ -z "${{ github.event.before }}" || "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-parse origin/master)"
            else
              BASE_SHA="${{ github.event.before }}"
            fi
            # `...` diffs from the merge-base, so unrelated commits the base
            # picked up after this branch forked don't show as "changes here".
            if git diff --name-only "$BASE_SHA"...${{ github.sha }} | grep -E "(^apps/${{ matrix.service }}/|^package\.json|^yarn\.lock|^turbo\.json|^\.github/workflows/)"; then
              echo "needs_build=true" >> $GITHUB_OUTPUT
            else
              echo "needs_build=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.needs_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "yarn"

      - name: Configure Yarn
        if: steps.changes.outputs.needs_build == 'true'
        run: |
          yarn config set network-timeout 600000

      - name: Install dependencies
        if: steps.changes.outputs.needs_build == 'true'
        run: yarn install --frozen-lockfile
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
          HUSKY: 0
        timeout-minutes: 15

      - name: Run linting for ${{ matrix.service }}
        if: steps.changes.outputs.needs_build == 'true'
        run: yarn turbo run lint --filter=${{ matrix.service }} --only

  test:
    name: Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [api-gateway, api, jobs, web]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if service needs testing
        id: changes
        run: |
          # Check if this is a scheduled run, tag, or if service files changed
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "needs_build=true" >> $GITHUB_OUTPUT
          else
            # Resolve base SHA per event type. `github.event.before` only exists
            # on push events; pull_request events expand it to empty, which made
            # the diff a no-op and silently skipped every job on every PR.
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            elif [[ -z "${{ github.event.before }}" || "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-parse origin/master)"
            else
              BASE_SHA="${{ github.event.before }}"
            fi
            # `...` diffs from the merge-base, so unrelated commits the base
            # picked up after this branch forked don't show as "changes here".
            if git diff --name-only "$BASE_SHA"...${{ github.sha }} | grep -E "(^apps/${{ matrix.service }}/|^package\.json|^yarn\.lock|^turbo\.json|^\.github/workflows/)"; then
              echo "needs_build=true" >> $GITHUB_OUTPUT
            else
              echo "needs_build=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.needs_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "yarn"

      - name: Configure Yarn
        if: steps.changes.outputs.needs_build == 'true'
        run: |
          yarn config set network-timeout 600000

      - name: Install dependencies
        if: steps.changes.outputs.needs_build == 'true'
        run: yarn install --frozen-lockfile
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
          HUSKY: 0
        timeout-minutes: 15

      - name: Run tests for ${{ matrix.service }}
        if: steps.changes.outputs.needs_build == 'true'
        run: yarn turbo run test --filter=${{ matrix.service }} --only -- -- --watchAll=false
        timeout-minutes: 10

  job-microservice-contract-test:
    name: Job Microservice Insomnia Tests
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    env:
      INSO_VERSION: 12.5.0
      INSOMNIA_ENV: ${{ github.event.inputs.insomnia_environment || vars.INSOMNIA_ENV || 'staging' }}
      MARK_API_BASE_URL: ${{ secrets.INSOMNIA_MARK_API_BASE_URL }}
      JOB_QUEUE_HEADER_VALUE: ${{ secrets.INSOMNIA_JOB_QUEUE_SECRET }} # pragma: allowlist secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Insomnia test configuration
        id: insomnia-config
        run: |
          if [ -z "${MARK_API_BASE_URL:-}" ] || [ -z "${JOB_QUEUE_HEADER_VALUE:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Insomnia job tests because the required Insomnia base URL or queue key input is not configured."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Install Inso CLI
        if: steps.insomnia-config.outputs.enabled == 'true'
        run: |
          curl -L --fail --silent --show-error \
            "https://github.com/Kong/insomnia/releases/download/core%40${INSO_VERSION}/inso-linux-x64-${INSO_VERSION}.tar.xz" \
            -o /tmp/inso-linux.tar.xz
          mkdir -p /tmp/inso
          tar -xf /tmp/inso-linux.tar.xz -C /tmp/inso
          sudo install /tmp/inso/inso /usr/local/bin/inso
          inso --version

      - name: Run Insomnia job microservice tests
        if: steps.insomnia-config.outputs.enabled == 'true'
        run: |
          collection="docs/insomnia/job-microservice.insomnia.json"
          runtime_collection="$(mktemp)"

          if ! jq -e --arg envName "$INSOMNIA_ENV" '.resources[] | select(._type == "environment" and .name == $envName)' "$collection" >/dev/null; then
            echo "Unknown Insomnia environment: $INSOMNIA_ENV"
            exit 1
          fi

          jq \
            --arg envName "$INSOMNIA_ENV" \
            --arg baseUrl "$MARK_API_BASE_URL" \
            --arg queueHeaderValue "$JOB_QUEUE_HEADER_VALUE" \
            '(.resources[] | select(._type == "environment" and .name == $envName) | .data.base_url) = $baseUrl
             | (.resources[] | select(._type == "environment" and .name == $envName) | .data.job_queue_header_value) = $queueHeaderValue' \
            "$collection" > "$runtime_collection"

          inso run test "Job Microservice" \
            --env "$INSOMNIA_ENV" \
            --workingDir "$runtime_collection" \
            --ci \
            --bail \
            --requestTimeout 10000

  build-image:
    name: Build - ${{ matrix.service }}
    # Builds the image in parallel with security-scan, test, and lint —
    # no `needs:` so it starts immediately. On non-PR events the resulting
    # image is saved to disk as a docker tar and uploaded as a workflow
    # artifact for the deploy-image job below. On PRs the artifact upload
    # is skipped; the build runs purely as a Dockerfile smoke test.
    # Nothing is pushed from this job — publishing is gated downstream
    # in deploy-image.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [api-gateway, api, jobs, web]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if service needs building
        id: changes
        run: |
          # Check if this is a scheduled run, tag, or if service files changed
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "needs_build=true" >> $GITHUB_OUTPUT
          else
            # Resolve base SHA per event type. `github.event.before` only exists
            # on push events; pull_request events expand it to empty, which made
            # the diff a no-op and silently skipped every job on every PR.
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            elif [[ -z "${{ github.event.before }}" || "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-parse origin/master)"
            else
              BASE_SHA="${{ github.event.before }}"
            fi
            # `...` diffs from the merge-base, so unrelated commits the base
            # picked up after this branch forked don't show as "changes here".
            if git diff --name-only "$BASE_SHA"...${{ github.sha }} | grep -E "(^apps/${{ matrix.service }}/|^package\.json|^yarn\.lock|^turbo\.json|^\.github/workflows/)"; then
              echo "needs_build=true" >> $GITHUB_OUTPUT
            else
              echo "needs_build=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.needs_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        if: steps.changes.outputs.needs_build == 'true'
        id: meta
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          elif [[ $GITHUB_REF == refs/heads/* ]]; then
            BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
            SHORT_SHA=$(git rev-parse --short HEAD)
            IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            IMAGE_TAG="sha-${SHORT_SHA}"
          fi
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Build ${{ matrix.service }} image
        if: steps.changes.outputs.needs_build == 'true'
        uses: docker/build-push-action@v6
        id: build
        timeout-minutes: 45
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          # Always build to a local tar; deploy-image loads + pushes after
          # security-scan and test go green. Nothing is pushed from this job.
          push: false
          outputs: type=docker,dest=/tmp/mark-${{ matrix.service }}-image.tar
          # Tags get baked into the saved image, so docker load in
          # deploy-image picks them up directly. The :latest tag is only
          # included on master / tag pushes (downstream pulls treat
          # :latest as production).
          tags: |
            ghcr.io/${{ github.repository }}/mark-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && format('ghcr.io/{0}/mark-{1}:latest', github.repository, matrix.service) || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          # Only write the GHA cache on push events that survive into a
          # release path (master / tags / scheduled / manual). PR builds
          # still READ master's cache via cache-from but skip the export.
          cache-to: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('type=gha,mode=max,scope={0},ignore-error=true', matrix.service) || '' }}
          platforms: linux/amd64

      - name: Upload image artifact for deploy
        if: steps.changes.outputs.needs_build == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ github.run_number }}
          path: /tmp/mark-${{ matrix.service }}-image.tar
          # The tar is only consumed by the deploy-image job in the same
          # workflow run, so 1-day retention is plenty.
          retention-days: 1
          # The contents are docker layers (already gzip-compressed
          # internally); re-compressing wastes CPU.
          compression-level: 0

  deploy-image:
    name: Deploy - ${{ matrix.service }}
    # Publishes the image built in build-image to GHCR, runs the container
    # security scan, and triggers the external image mirror. Skipped on
    # PRs (no GHCR publish on unmerged code) and on any run where the
    # security-scan or test jobs failed. `always()` lets per-service slots
    # run independently — if build-image fails for one service the others
    # still publish, matching the previous build-and-deploy behavior.
    if: |
      always()
      && github.event_name != 'pull_request'
      && needs.security-scan.result == 'success'
      && needs.test.result == 'success'
    needs: [build-image, security-scan, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        service: [api-gateway, api, jobs, web]
      fail-fast: false
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if service needs building
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "needs_build=true" >> $GITHUB_OUTPUT
          else
            if [[ -z "${{ github.event.before }}" || "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-parse origin/master)"
            else
              BASE_SHA="${{ github.event.before }}"
            fi
            if git diff --name-only "$BASE_SHA"...${{ github.sha }} | grep -E "(^apps/${{ matrix.service }}/|^package\.json|^yarn\.lock|^turbo\.json|^\.github/workflows/)"; then
              echo "needs_build=true" >> $GITHUB_OUTPUT
            else
              echo "needs_build=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Download image artifact
        if: steps.changes.outputs.needs_build == 'true'
        id: download
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ github.run_number }}
          path: /tmp
        # If build-image failed for this matrix slot (other slots may have
        # succeeded), the artifact won't exist. Don't fail the whole job —
        # the subsequent steps gate on download success.
        continue-on-error: true

      - name: Load image into docker daemon
        if: steps.changes.outputs.needs_build == 'true' && steps.download.outcome == 'success'
        run: docker load --input /tmp/mark-${{ matrix.service }}-image.tar

      - name: Compute image metadata
        if: steps.changes.outputs.needs_build == 'true' && steps.download.outcome == 'success'
        id: meta
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          elif [[ $GITHUB_REF == refs/heads/* ]]; then
            BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
            SHORT_SHA=$(git rev-parse --short HEAD)
            IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            IMAGE_TAG="sha-${SHORT_SHA}"
          fi
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        if: steps.changes.outputs.needs_build == 'true' && steps.download.outcome == 'success'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: steps.changes.outputs.needs_build == 'true' && steps.download.outcome == 'success'
        run: |
          docker push "ghcr.io/${{ github.repository }}/mark-${{ matrix.service }}:${IMAGE_TAG}"
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]] || [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            docker push "ghcr.io/${{ github.repository }}/mark-${{ matrix.service }}:latest"
          fi

      - name: Run container security scan
        if: steps.changes.outputs.needs_build == 'true' && steps.download.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/mark-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: "sarif"
          output: "trivy-container-${{ matrix.service }}.sarif"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
        continue-on-error: true

      - name: Check if container SARIF file exists
        if: always() && steps.changes.outputs.needs_build == 'true' && steps.download.outcome == 'success'
        id: container-sarif-check
        run: |
          if [ -f "trivy-container-${{ matrix.service }}.sarif" ]; then
            echo "sarif_exists=true" >> $GITHUB_OUTPUT
          else
            echo "sarif_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Container SARIF file trivy-container-${{ matrix.service }}.sarif not found"
          fi

      - name: Upload container scan results
        if: always() && steps.changes.outputs.needs_build == 'true' && steps.download.outcome == 'success' && steps.container-sarif-check.outputs.sarif_exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-container-${{ matrix.service }}.sarif"
          category: trivy-container-${{ matrix.service }}

      - name: Upload container security reports as artifacts
        if: always() && steps.changes.outputs.needs_build == 'true' && steps.download.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: container-security-reports-${{ matrix.service }}-${{ github.run_number }}
          path: |
            trivy-container-${{ matrix.service }}.sarif
          retention-days: 30

      - name: Trigger external image mirror
        if: steps.changes.outputs.needs_build == 'true' && steps.download.outcome == 'success'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN_MIRROR_TO_ICR }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/ibm-skills-network/security-compliance-automation/actions/workflows/build-external-images.yml/dispatches \
            -d '{
                "ref": "main",
                "inputs": {
                  "image": "ghcr.io/${{ github.repository }}/mark-${{ matrix.service }}:${{ env.IMAGE_TAG }}"
                }
              }'

      - name: Generate security summary
        if: always() && steps.changes.outputs.needs_build == 'true' && steps.download.outcome == 'success'
        run: |
          echo "## Security Scan Summary for ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Filesystem scan summary
          if [ -f "trivy-fs-${{ matrix.service }}.sarif" ]; then
            CRITICAL=$(jq '.runs[0].results[] | select(.level == "error" and (.ruleId | contains("CRITICAL")))' trivy-fs-${{ matrix.service }}.sarif | wc -l)
            HIGH=$(jq '.runs[0].results[] | select(.level == "error" and (.ruleId | contains("HIGH")))' trivy-fs-${{ matrix.service }}.sarif | wc -l)
            MEDIUM=$(jq '.runs[0].results[] | select(.level == "warning" and (.ruleId | contains("MEDIUM")))' trivy-fs-${{ matrix.service }}.sarif | wc -l)
            echo "### Filesystem Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "- Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
            echo "- High: $HIGH" >> $GITHUB_STEP_SUMMARY
            echo "- Medium: $MEDIUM" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Container scan summary
          if [ -f "trivy-container-${{ matrix.service }}.sarif" ]; then
            CRITICAL=$(jq '.runs[0].results[] | select(.level == "error" and (.ruleId | contains("CRITICAL")))' trivy-container-${{ matrix.service }}.sarif | wc -l)
            HIGH=$(jq '.runs[0].results[] | select(.level == "error" and (.ruleId | contains("HIGH")))' trivy-container-${{ matrix.service }}.sarif | wc -l)
            MEDIUM=$(jq '.runs[0].results[] | select(.level == "warning" and (.ruleId | contains("MEDIUM")))' trivy-container-${{ matrix.service }}.sarif | wc -l)
            echo "### Container Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "- Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
            echo "- High: $HIGH" >> $GITHUB_STEP_SUMMARY
            echo "- Medium: $MEDIUM" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Dependency audit summary
          if [ -f "yarn-audit-${{ matrix.service }}.json" ]; then
            ADVISORIES=$(jq '.metadata.totalDependencies // 0' yarn-audit-${{ matrix.service }}.json)
            VULNERABILITIES=$(jq '.metadata.vulnerabilities | length // 0' yarn-audit-${{ matrix.service }}.json)
            echo "### Dependency Audit Results" >> $GITHUB_STEP_SUMMARY
            echo "- Total Dependencies: $ADVISORIES" >> $GITHUB_STEP_SUMMARY
            echo "- Vulnerabilities Found: $VULNERABILITIES" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "📊 **View detailed reports in the workflow artifacts**" >> $GITHUB_STEP_SUMMARY
