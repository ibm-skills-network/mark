name: Playwright Tests

on:
  push:
    branches: [master, fix/playwright-integration]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: mark-pg-user
          POSTGRES_PASSWORD: mark-pg-password # pragma: allowlist secret
          POSTGRES_DB: mark-pg
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.0.0"
          cache: "yarn"

      - name: Configure Yarn
        run: |
          yarn config set network-timeout 600000
          yarn config set network-concurrency 1
          yarn config set child-concurrency 1

      - name: Install canvas system dependencies
        run: sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: yarn install --frozen-lockfile --verbose
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
          HUSKY: 0
        timeout-minutes: 15

      - name: Create root dev.env
        run: |
          cat > dev.env <<'EOF'
          export PORT=3010
          export API_PORT=4222
          export API_GATEWAY_PORT=8000
          export API_GATEWAY_HOST=http://127.0.0.1:8000
          export AUTH_DISABLED=true
          export NODE_ENV=development
          export POSTGRES_HOST=localhost
          export POSTGRES_PORT=5432
          export POSTGRES_EXTERNAL_PORT=5432
          export POSTGRES_USER=mark-pg-user
          export POSTGRES_PASSWORD=mark-pg-password # pragma: allowlist secret
          export POSTGRES_DB=mark-pg
          SECRET=devsecret # pragma: allowlist secret
          EOF

      - name: Create API dev.env
        run: |
          cat > apps/api/dev.env <<'EOF'
          export NODE_ENV=development
          export API_PORT=4222
          export DATABASE_URL=postgresql://mark-pg-user:mark-pg-password@localhost:5432/mark-pg # pragma: allowlist secret
          export DATABASE_URL_DIRECT=postgresql://mark-pg-user:mark-pg-password@localhost:5432/mark-pg # pragma: allowlist secret
          EOF

      - name: Create API Gateway dev.env
        run: |
          cat > apps/api-gateway/dev.env <<'EOF'
          NODE_ENV=development
          API_GATEWAY_PORT=8000
          MARK_API_ENDPOINT=http://localhost:4222
          AUTH_DISABLED=true
          SECRET=devsecret # pragma: allowlist secret
          EOF

      - name: Run database migrations
        run: |
          cd apps/api
          export DATABASE_URL="postgresql://mark-pg-user:mark-pg-password@localhost:5432/mark-pg" # pragma: allowlist secret
          export DATABASE_URL_DIRECT="postgresql://mark-pg-user:mark-pg-password@localhost:5432/mark-pg" # pragma: allowlist secret
          npx prisma migrate deploy
          npx prisma generate

      - name: Install Playwright browsers
        run: yarn playwright:install

      - name: Build web app for E2E
        run: yarn --cwd apps/web build:e2e

      - name: Run Playwright tests
        run: yarn test:e2e:all
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
