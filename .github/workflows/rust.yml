name: Rust

on:
  # Same convention as build-images.yml: PRs cover feature branches, and only
  # master pushes and tags publish images.
  push:
    branches:
      - master
    tags:
      - "*"
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    branches:
      - master
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mark
          POSTGRES_PASSWORD: mark # pragma: allowlist secret
          POSTGRES_DB: mark
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
        env:
          DATABASE_URL: postgres://mark:mark@localhost:5432/mark # pragma: allowlist secret

      - name: Release build
        run: cargo build --release --locked
        env:
          MARK_BUILD_SHA: ${{ github.sha }}
          MARK_BUILD_REF: ${{ github.ref_name }}

  image:
    name: Image - ${{ matrix.bin }}
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        bin: [mark-api, mark-worker]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if image needs building
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            elif [[ -z "${{ github.event.before }}" || "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-parse origin/master)"
            else
              BASE_SHA="${{ github.event.before }}"
            fi
            # Fail closed: if the diff itself fails, build.
            if ! CHANGED=$(git diff --name-only "$BASE_SHA"...${{ github.sha }}); then
              echo "needs_build=true" >> "$GITHUB_OUTPUT"
            elif echo "$CHANGED" | grep -E "(^rust/|^rust-toolchain\.toml|^\.github/workflows/rust\.yml)"; then
              echo "needs_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "needs_build=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.needs_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: steps.changes.outputs.needs_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.changes.outputs.needs_build == 'true'
        id: meta
        run: |
          BIN="${{ matrix.bin }}"
          IMAGE_NAME="mark-rust-${BIN#mark-}"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          elif [[ $GITHUB_REF == refs/heads/* ]]; then
            BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
            SHORT_SHA=$(git rev-parse --short HEAD)
            IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            IMAGE_TAG="sha-${SHORT_SHA}"
          fi
          echo "image-name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Build and push ${{ matrix.bin }} image
        if: steps.changes.outputs.needs_build == 'true'
        uses: docker/build-push-action@v6
        id: build-push
        timeout-minutes: 45
        with:
          context: .
          file: rust/Dockerfile
          build-args: |
            BIN=${{ matrix.bin }}
            MARK_BUILD_SHA=${{ github.sha }}
            MARK_BUILD_REF=${{ github.ref_name }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && format('ghcr.io/{0}/{1}:latest', github.repository, env.IMAGE_NAME) || '' }}
          cache-from: type=gha,scope=rust-${{ matrix.bin }}
          cache-to: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch') && format('type=gha,mode=max,scope=rust-{0},ignore-error=true', matrix.bin) || '' }}
          platforms: linux/amd64

      - name: Run container security scan
        if: steps.changes.outputs.needs_build == 'true' && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: "sarif"
          output: "trivy-container-${{ matrix.bin }}.sarif"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
        continue-on-error: true

      - name: Check if container SARIF file exists
        if: always() && steps.changes.outputs.needs_build == 'true' && github.event_name != 'pull_request'
        id: container-sarif-check
        run: |
          if [ -f "trivy-container-${{ matrix.bin }}.sarif" ]; then
            echo "sarif_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Container SARIF file trivy-container-${{ matrix.bin }}.sarif not found"
          fi

      - name: Upload container scan results
        if: always() && steps.changes.outputs.needs_build == 'true' && github.event_name != 'pull_request' && steps.container-sarif-check.outputs.sarif_exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-container-${{ matrix.bin }}.sarif"
          category: trivy-container-${{ matrix.bin }}

      - name: Upload container security reports as artifacts
        if: always() && steps.changes.outputs.needs_build == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: container-security-reports-${{ matrix.bin }}-${{ github.run_number }}
          path: |
            trivy-container-${{ matrix.bin }}.sarif
          retention-days: 30

      - name: Trigger external image mirror
        if: steps.changes.outputs.needs_build == 'true' && github.event_name != 'pull_request'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN_MIRROR_TO_ICR }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/ibm-skills-network/security-compliance-automation/actions/workflows/build-external-images.yml/dispatches \
            -d '{
                "ref": "main",
                "inputs": {
                  "image": "ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
                }
              }'

      - name: Generate image summary
        if: always() && steps.changes.outputs.needs_build == 'true'
        run: |
          SARIF="trivy-container-${{ matrix.bin }}.sarif"
          {
            echo "## Image summary for ${{ matrix.bin }}"
            echo ""
            echo "- Image: \`ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\`"
            echo "- Pushed: ${{ github.event_name != 'pull_request' }}"
            echo ""
            if [ -f "$SARIF" ]; then
              CRITICAL=$(jq '.runs[0].results[] | select(.level == "error" and (.ruleId | contains("CRITICAL")))' "$SARIF" | wc -l)
              HIGH=$(jq '.runs[0].results[] | select(.level == "error" and (.ruleId | contains("HIGH")))' "$SARIF" | wc -l)
              MEDIUM=$(jq '.runs[0].results[] | select(.level == "warning" and (.ruleId | contains("MEDIUM")))' "$SARIF" | wc -l)
              echo "### Container Scan Results"
              echo "- Critical: $CRITICAL"
              echo "- High: $HIGH"
              echo "- Medium: $MEDIUM"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  result:
    name: result
    runs-on: ubuntu-latest
    needs: [check, image]
    if: always()
    permissions: {}
    steps:
      - name: Check job results
        run: |
          echo "check: ${{ needs.check.result }}"
          echo "image: ${{ needs.image.result }}"
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.image.result }}" == "failure" || "${{ needs.image.result }}" == "cancelled" ]]; then
            exit 1
          fi
