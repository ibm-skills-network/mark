version: 2

# One npm entry only. This repo is a yarn workspaces monorepo with a single
# root yarn.lock, so Dependabot has to resolve from "/" to be able to write it.
# The per-workspace entries that used to live here (/apps/api, /apps/web, ...)
# could edit that app's package.json but not the root lockfile, so every PR
# they raised landed package.json and yarn.lock out of sync — CI then resolved
# the new ranges ad hoc and pulled duplicate copies of hoisted packages.
#
# Minor + patch updates are grouped into a single PR so CI cost stays bounded.
# Major version bumps are ignored entirely — we handle major upgrades manually
# because they almost always need a deliberate migration. Security advisories
# are NOT affected by the ignore rules; Dependabot still raises individual
# security PRs immediately.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      actions-all:
        update-types:
          - minor
          - patch
