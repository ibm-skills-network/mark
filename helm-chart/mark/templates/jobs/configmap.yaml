{{- if .Values.jobs.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mark.jobs.name" . }}-config
  annotations: {{- include "mark.install-first.annotations" $ | nindent 4 }}
data:
{{- range $name, $value := .Values.jobs.env }}
  {{ $name }}: {{ $value | quote }}
{{- end }}
{{- end }}
