{{- if .Values.apiGateway.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mark.api-gateway.name" . }}-config
data:
{{- range $name, $value := .Values.apiGateway.env }}
  {{ $name }}: {{ $value | quote }}
{{- end }}
{{- if .Values.rustApi.enabled }}
  MARK_RUST_API_ENDPOINT: {{ printf "http://%s:%v" (include "mark.rustApi.name" .) .Values.rustApi.service.port | quote }}
  MARK_RUST_ROUTES: {{ join "," (.Values.rustApi.routes | default list) | quote }}
{{- end }}
{{- end }}