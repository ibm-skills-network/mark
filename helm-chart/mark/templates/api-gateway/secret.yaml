{{- if .Values.apiGateway.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mark.api-gateway.name" $ }}-secrets
type: Opaque
stringData:
  JOB_QUEUE_SECRET: {{ .Values.jobQueue.secret | quote }}
{{- range $name, $value := .Values.apiGateway.secretEnv }}
  {{ $name }}: {{ $value | quote }}
{{- end }}
{{- end }}
