{{- if .Values.rustApi.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mark.rustApi.name" . }}-config
  labels:
    {{- include "mark.rustApi.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.rustApi.containerPort | quote }}
{{- range $name, $value := .Values.rustApi.config }}
{{- if ne $name "PORT" }}
  {{ $name }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
{{- end }}
