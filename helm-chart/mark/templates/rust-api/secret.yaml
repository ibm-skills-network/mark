{{- if .Values.rustApi.enabled }}
{{- if not .Values.rustApi.secrets.DATABASE_URL }}
{{- fail "rustApi.secrets.DATABASE_URL is required when rustApi.enabled is true" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mark.rustApi.name" . }}-secrets
  labels:
    {{- include "mark.rustApi.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $name, $value := .Values.rustApi.secrets }}
  {{ $name }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
