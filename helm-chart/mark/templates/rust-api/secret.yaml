{{- if .Values.rustApi.enabled }}
{{- $db := .Values.rustApi.markDBName | default .Values.api.markDBName }}
{{- $url := .Values.rustApi.secrets.DATABASE_URL | default (printf "postgresql://%s:%s@%s:%v/%s" .Values.postgres.username .Values.postgres.password .Values.postgres.hostname .Values.postgres.port $db) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mark.rustApi.name" . }}-secrets
  labels:
    {{- include "mark.rustApi.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $url | quote }}
{{- range $name, $value := .Values.rustApi.secrets }}
{{- if ne $name "DATABASE_URL" }}
  {{ $name }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
{{- end }}
