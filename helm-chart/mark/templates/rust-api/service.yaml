{{- if .Values.rustApi.enabled }}
{{- with .Values.rustApi }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mark.rustApi.name" $ }}
  labels:
    {{- include "mark.rustApi.labels" $ | nindent 4 }}
spec:
  type: {{ .service.type }}
  ports:
    - port: {{ .service.port }}
      targetPort: {{ .containerPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "mark.rustApi.labels" $ | nindent 4 }}
{{- end }}
{{- end }}
