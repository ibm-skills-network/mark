{{- if .Values.rustWorker.enabled }}
{{- $db := .Values.rustWorker.markDBName | default .Values.api.markDBName }}
{{- $url := .Values.rustWorker.secrets.DATABASE_URL | default (printf "postgresql://%s:%s@%s:%v/%s" .Values.postgres.username .Values.postgres.password .Values.postgres.hostname .Values.postgres.port $db) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mark.rustWorker.name" . }}-secrets
  annotations:
    # Kept on removal from this chart: the mark-rust release adopts it.
    helm.sh/resource-policy: keep
  labels:
    {{- include "mark.rustWorker.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $url | quote }}
{{- range $name, $value := .Values.rustWorker.secrets }}
{{- if ne $name "DATABASE_URL" }}
  {{ $name }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
{{- end }}
