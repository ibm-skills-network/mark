{{- if .Values.rustWorker.enabled }}
{{- if not .Values.rustWorker.secrets.DATABASE_URL }}
{{- fail "rustWorker.secrets.DATABASE_URL is required when rustWorker.enabled is true" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mark.rustWorker.name" . }}-secrets
  labels:
    {{- include "mark.rustWorker.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $name, $value := .Values.rustWorker.secrets }}
  {{ $name }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
