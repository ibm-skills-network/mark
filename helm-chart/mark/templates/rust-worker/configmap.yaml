{{- if .Values.rustWorker.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mark.rustWorker.name" . }}-config
  annotations:
    # Kept on removal from this chart: the mark-rust release adopts it.
    helm.sh/resource-policy: keep
  labels:
    {{- include "mark.rustWorker.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.rustWorker.containerPort | quote }}
{{- range $name, $value := .Values.rustWorker.config }}
{{- if ne $name "PORT" }}
  {{ $name }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
{{- end }}
