# Default values for mark.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

fullnameOverride: ""
nameOverride: ""

# Global configurations applicable across components
global:
  imagePullSecrets:
    - name: icr-global

# API Gateway configurations
apiGateway:
  enabled: true
  autoscaling:
    enabled: false
  replicaCount: 3
  image:
    repository: icr.io/skills-network/mark-api-gateway
    pullPolicy: IfNotPresent
  containerPort: 3000  
  service:
    type: ClusterIP
    port: 80
  resources: {}
  livenessProbe:
    initialDelaySeconds: 10
    timeoutSeconds: 1
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 10
    timeoutSeconds: 1
    periodSeconds: 15
  env:
    API_GATEWAY_PORT: 3000
  secretEnv: {}

# LTI Gateway configurations
lti-gateway:
  replicaCount: 3
  resources: {}
  secretEnv: {}
  ltiCredentials: {}
  jwtCredentials: {}
  imagePullSecrets:
    - name: icr-global 

# API configurations
api:
  enabled: true
  autoscaling:
    enabled: false
  replicaCount: 3
  image:
    repository: icr.io/skills-network/mark-api
    pullPolicy: IfNotPresent
  containerPort: 3000  
  service:
    type: ClusterIP
    port: 80
  resources: {}
  livenessProbe:
    initialDelaySeconds: 10
    timeoutSeconds: 1
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 10
    timeoutSeconds: 1
    periodSeconds: 15
  markDBName: ''
  usePgBouncer: true
  env:
    API_PORT: 3000
    ENABLE_JOB_SCHEDULERS: "false"
    # Master switches for the two staged rollouts. Both default to "false"
    # in the chart so a fresh install ships with the legacy code paths and
    # the new author-side publish-progress card stays hidden. Flip to
    # "true" per-environment in the deploy overlay once the rollout window
    # is open. Runtime check is strict equality with "true".
    ENABLE_TRANSLATION: "false"
    ENABLE_PARALLEL_GRADING: "false"
    # Bump when a rolling model or grading semantics change so persistent
    # grading cache entries are not reused across deployments.
    GRADING_CACHE_REVISION: "2026-09-22-complete-text-and-rubric"
    # Bottleneck maxConcurrent ceiling on parallel LLM calls inside ONE
    # grading job (the wave scheduler's fan-out cap). Distinct from
    # GRADING_WORKER_CONCURRENCY on mark-jobs, which controls how many
    # grading jobs the BullMQ worker pulls in parallel per pod.
    GRADING_CONCURRENCY: "10"
  secretEnv:
    # SN Support ticket forwarding; unset leaves the integration disabled.
    SN_SUPPORT_URL: ""
    # SN Support resolves a ticket's product from the API key alone, so Mark
    # holds one key per product and picks by portal at report time. The var
    # name is derived from the product name (uppercase, non-alphanumerics to
    # "_"), so a new product needs a secret here and no code change.
    #
    # SUPPORT_TOKEN_MARK is the catch-all: a report whose portal nothing
    # recognizes is filed against Mark's own product rather than dropped into a
    # portal team's queue.
    SUPPORT_TOKEN_MARK: ""
    SUPPORT_TOKEN_PORTALS: ""
    SUPPORT_TOKEN_COGNITIVE_CLASS: ""
    SUPPORT_TOKEN_COURSERA: ""
    SUPPORT_TOKEN_EDX: ""
    SUPPORT_TOKEN_ICE: ""
    SUPPORT_TOKEN_LABS: ""
    SUPPORT_TOKEN_FACULTY: ""
    # portal-manager is the source of truth for which product owns a portal
    # hostname. Without it, known LTI platforms use their product key; other
    # hosts use SUPPORT_TOKEN_MARK. No ticket is sent without a usable key.
    PORTAL_MANAGER_API_BASE_URL: ""
    PORTAL_MANAGER_TOKEN_URL: ""
    PORTAL_MANAGER_UID: ""
    PORTAL_MANAGER_SECRET: ""

jobs:
  enabled: false
  autoscaling:
    enabled: false
  replicaCount: 1
  image:
    repository: icr.io/skills-network/mark-jobs
    pullPolicy: IfNotPresent
  resources: {}
  env:
    ENABLE_JOB_SCHEDULERS: "true"
    # Enable Instana APM for the jobs worker. The collector reads
    # INSTANA_SERVICE_NAME to label this service in Instana.
    INSTANA_ENABLED: "true"
    INSTANA_SERVICE_NAME: "mark-jobs"
  secretEnv: {}

# Rust API configurations
rustApi:
  enabled: false
  replicaCount: 1
  # Defaults to api.markDBName; DATABASE_URL is built from the postgres values unless secrets.DATABASE_URL is set.
  markDBName: ''
  image:
    repository: ghcr.io/ibm-skills-network/mark/mark-rust-api
    tag: ""
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    initialDelaySeconds: 5
    timeoutSeconds: 1
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 5
    timeoutSeconds: 3
    periodSeconds: 10
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}
  config:
    LOG_FORMAT: "json"
    RUST_LOG: "info"
    SERVICE_NAME: "mark-rust-api"
    # Execution switches; keep "false" until the Rust path is cut over.
    MARK_RUST_ACCEPT_OPERATIONS: "false"
    MARK_RUST_CONSUME_WORK: "false"
    MARK_RUST_DISPATCH_EXTERNAL_EFFECTS: "false"
  secrets:
    DATABASE_URL: ""

# Rust worker configurations
rustWorker:
  enabled: false
  replicaCount: 1
  # Defaults to api.markDBName; DATABASE_URL is built from the postgres values unless secrets.DATABASE_URL is set.
  markDBName: ''
  image:
    repository: ghcr.io/ibm-skills-network/mark/mark-rust-worker
    tag: ""
    pullPolicy: IfNotPresent
  containerPort: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    initialDelaySeconds: 5
    timeoutSeconds: 1
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 5
    timeoutSeconds: 3
    periodSeconds: 10
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}
  config:
    LOG_FORMAT: "json"
    RUST_LOG: "info"
    SERVICE_NAME: "mark-rust-worker"
    # Execution switches; keep "false" until the Rust path is cut over.
    MARK_RUST_ACCEPT_OPERATIONS: "false"
    MARK_RUST_CONSUME_WORK: "false"
    MARK_RUST_DISPATCH_EXTERNAL_EFFECTS: "false"
  secrets:
    DATABASE_URL: ""

# UI configurations
ui:
  enabled: true
  autoscaling:
    enabled: false
  replicaCount: 3
  image:
    repository: icr.io/skills-network/mark-ui
    pullPolicy: IfNotPresent
  containerPort: 3000  
  service:
    type: ClusterIP
    port: 80
  resources: {}
  env:
    PORT: 3000
    # Selects per-environment server-side behavior in the web app —
    # currently the Instana Real-User-Monitoring key selection in
    # app/layout.tsx. Only "staging" or "production" activate the RUM
    # snippet. Chart default "development" keeps RUM off for fresh
    # installs; deploy overlay sets it to {{ .Environment.Name }} so
    # one image carries the right key per environment at runtime.
    APP_ENV: "development"
  secretEnv: {}

# LTI Credentials Manager configurations
ltiCredentialsManager:
  enabled: true
  autoscaling:
    enabled: false
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  replicaCount: 3
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  image:
    repository: icr.io/skills-network-labs/admin
    pullPolicy: IfNotPresent
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  accessKey: ""
  secretKey: ""
  secretKeyBase: ""
  env:
    DB_NAME: "mark-lti"
    MALLOC_ARENA_MAX: "2"
    PICARD_ENV: production
    RAILS_ENV: production
    PG_SSL_MODE: "disable"
  secretEnv: {}

# Ingress configurations
ingress:
  enabled: true
  className: public-iks-k8s-nginx
  annotations: 
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  tls:
    secretName: ""

privateIngress:
  enabled: true
  className: private-iks-k8s-nginx
  nginx.ingress.kubernetes.io/proxy-body-size: "50m"

postgres:
  username: ""
  password: ""
  hostname: ""
  port: 5432

redis:
  url: ""

jobQueue:
  secret: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""    

linkerd:
  enabled: false

baseDomain: ""

networkPolicy:
  enabled: true
  natsPort: ""
