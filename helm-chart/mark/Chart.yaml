apiVersion: v2
name: mark
description: |
  Mark is a comprehensive educational platform for assignment management and grading.
  This Helm chart deploys the complete Mark application stack including API Gateway,
  Core API, Web UI, and LTI integration capabilities.

type: application
version: 1.4.0
appVersion: "1.0.0"

# Chart metadata for discoverability
home: https://github.com/ibm-skills-network/mark
sources:
  - https://github.com/ibm-skills-network/mark
keywords:
  - education
  - lti
  - assignment
  - grading
  - learning-management
  - educational-technology
  - kubernetes
  - microservices

maintainers:
  - name: Mark Development Team
    email: maintainers@mark-platform.dev
    url: https://github.com/ibm-skills-network/mark

annotations:
  # Artifact Hub annotations for better discoverability
  artifacthub.io/license: MIT
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: mark-api-gateway
      image: ghcr.io/ibm-skills-network/mark/mark-api-gateway:latest
    - name: mark-api
      image: ghcr.io/ibm-skills-network/mark/mark-api:latest
    - name: mark-web
      image: ghcr.io/ibm-skills-network/mark/mark-web:latest
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/ibm-skills-network/mark/tree/master/helm-chart/mark
    - name: Documentation
      url: https://github.com/ibm-skills-network/mark/blob/master/helm-chart/README.md

dependencies:
  - name: lti-gateway
    version: 1.0.2
    repository: https://raw.githubusercontent.com/ibm-skills-network/helm-chart-releases/master
  - name: sn-common
    repository: https://raw.githubusercontent.com/ibm-skills-network/helm-chart-releases/master
    version: 1.x.x
