replicaCount: 1

image:
  repository: icr.io/skills-network/mark-jobs
  pullPolicy: IfNotPresent
  tag: ""

global:
  imagePullSecrets:
    - name: icr-global

resources: {}

postgres:
  username: ""
  password: ""
  hostname: ""
  port: 5432
  dbName: mark

redis:
  url: ""

jobQueue:
  secret: ""

env:
  ENABLE_JOB_SCHEDULERS: "true"
  # JOBS_EXECUTE_LOCALLY is the local-execution feature flag. The value MUST be the literal string "true"
  # to enable; any other value keeps the default-OFF forward-to-API path. The runtime check is strict
  # equality with "true".
  JOBS_EXECUTE_LOCALLY: "true"
  # In-process LtiSyncScheduler. Default OFF because the in-process
  # scheduler has a known race condition: with N>1 replicas, all pods
  # grab the same 50 SCHEDULED rows on each tick and PUT them in
  # parallel, causing duplicate submissions and burning retry budget.
  # Envs that want retries should ship a separate single-instance
  # mechanism (we use a K8s CronJob `lti-sync-drain` in apps-faculty-deploy
  # — see config/lti-sync-drain/cronjob.yaml). Once the race is fixed in
  # apps/api/src/api/attempt/schedulers/lti-sync-scheduler.ts (Redis
  # lock or FOR UPDATE SKIP LOCKED), this can be flipped back to "true"
  # and the CronJob retired.
  ENABLE_LTI_SCHEDULER: "false"
  ENABLE_TRANSLATION: "true"         # required by SharedModule TranslationService ctor
  TRANSLATION_CONCURRENCY: "8"       # BullMQ worker concurrency for mark.assignment.v2.translations queue
  # Number of grading JOBS the BullMQ worker pulls from the mark.attempt
  # queue concurrently. Distinct from GRADING_CONCURRENCY on mark-api,
  # which caps how many LLM CALLS run inside one grading job. Was sharing
  # the GRADING_CONCURRENCY name with the LLM cap; renamed so tuning one
  # tier doesn't silently retune the other.
  GRADING_WORKER_CONCURRENCY: "4"
  # Master switch for the dependency-level wave grading scheduler. mark-jobs
  # is where ATTEMPT_GRADE actually executes (JOBS_EXECUTE_LOCALLY=true), so
  # this is the tier where the flag is load-bearing. Chart default "false"
  # keeps the legacy sequential path active; per-environment overlays flip
  # to "true" when the rollout window is open. Runtime check is strict
  # equality with "true".
  ENABLE_PARALLEL_GRADING: "false"

secretEnv: {}
