replicaCount: 1

image:
  repository: icr.io/skills-network/mark-jobs
  pullPolicy: IfNotPresent
  tag: ""

global:
  imagePullSecrets:
    - name: icr-global

resources: {}

postgres:
  username: ""
  password: ""
  hostname: ""
  port: 5432
  dbName: mark

redis:
  url: ""

jobQueue:
  secret: ""

env:
  ENABLE_JOB_SCHEDULERS: "true"
  # JOBS_EXECUTE_LOCALLY is the local-execution feature flag. The value MUST be the literal string "true"
  # to enable; any other value (including the empty string rendered here) keeps the default-OFF
  # forward-to-API path. Empty string is preserved as a visible default so operators know the key exists;
  # the runtime check is strict equality with "true".
  JOBS_EXECUTE_LOCALLY: ""
  ENABLE_LTI_SCHEDULER: "false"      # gate the LTI cron in mark-jobs
  ENABLE_TRANSLATION: "true"         # required by SharedModule TranslationService ctor

secretEnv: {}
