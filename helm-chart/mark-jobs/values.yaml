replicaCount: 1

image:
  repository: icr.io/skills-network/mark-jobs
  pullPolicy: IfNotPresent
  tag: ""

global:
  imagePullSecrets:
    - name: icr-global

resources: {}

postgres:
  username: ""
  password: ""
  hostname: ""
  port: 5432
  dbName: mark

redis:
  url: ""

jobQueue:
  secret: ""

env:
  ENABLE_JOB_SCHEDULERS: "true"
  # JOBS_EXECUTE_LOCALLY is the local-execution feature flag. The value MUST be the literal string "true"
  # to enable; any other value keeps the default-OFF forward-to-API path. The runtime check is strict
  # equality with "true".
  JOBS_EXECUTE_LOCALLY: "true"
  # In-process LtiSyncScheduler. Default OFF because the in-process
  # scheduler has a known race condition: with N>1 replicas, all pods
  # grab the same 50 SCHEDULED rows on each tick and PUT them in
  # parallel, causing duplicate submissions and burning retry budget.
  # Envs that want retries should ship a separate single-instance
  # mechanism (this chart ships a K8s CronJob `lti-sync-drain` — see
  # templates/lti-sync-drain-cronjob.yaml, gated by ltiSyncDrain.enabled).
  # Once the race is fixed in
  # apps/api/src/api/attempt/schedulers/lti-sync-scheduler.ts (Redis
  # lock or FOR UPDATE SKIP LOCKED), this can be flipped back to "true"
  # and the CronJob retired.
  ENABLE_LTI_SCHEDULER: "false"
  ENABLE_TRANSLATION: "true"         # required by SharedModule TranslationService ctor
  TRANSLATION_CONCURRENCY: "8"       # BullMQ worker concurrency for mark.assignment.v2.translations queue
  # Number of grading JOBS the BullMQ worker pulls from the mark.attempt
  # queue concurrently. Distinct from GRADING_CONCURRENCY on mark-api,
  # which caps how many LLM CALLS run inside one grading job. Was sharing
  # the GRADING_CONCURRENCY name with the LLM cap; renamed so tuning one
  # tier doesn't silently retune the other.
  GRADING_WORKER_CONCURRENCY: "4"
  # Comma-separated queue names this deployment's pods consume. Unset/empty
  # means ALL queues (single-deployment and local-dev behavior). Deploy
  # overlays use this to split the fast and heavy worker tiers, e.g.
  #   fast:  every queue except mark.attempt.heavy
  #   heavy: "mark.attempt.heavy"
  # An unknown queue name fails the pod at boot (crash loop) by design.
  # JOB_WORKER_QUEUES: ""
  # BullMQ worker concurrency for mark.attempt.heavy when consumed. Default 1:
  # heavy jobs are the file/image extraction memory hogs, so one at a time
  # per pod unless observation says otherwise.
  # HEAVY_GRADING_WORKER_CONCURRENCY: "1"
  # Hard cap on evidence blocks per submission ingestion (spreadsheet text
  # splitting + PDF structure extraction). The code falls back to 50000 when
  # this is unset, empty, or not a positive integer.
  GRADING_MAX_EVIDENCE_BLOCKS: "50000"
  # Kill switch for structure-preserving PDF extraction (the pdfjs + canvas
  # render path). "true" (default) uses it; set to "false" to force all PDFs
  # through plain text extraction with no code change — an escape hatch if the
  # canvas path regresses (it has crashed workers via native segfault /
  # unhandled rejection on malformed PDFs). Runtime check is strict equality
  # with "false".
  ENABLE_PDF_STRUCTURED_EXTRACTION: "true"
  # Master switch for the dependency-level wave grading scheduler. mark-jobs
  # is where ATTEMPT_GRADE actually executes (JOBS_EXECUTE_LOCALLY=true), so
  # this is the tier where the flag is load-bearing. Chart default "false"
  # keeps the legacy sequential path active; per-environment overlays flip
  # to "true" when the rollout window is open. Runtime check is strict
  # equality with "true".
  ENABLE_PARALLEL_GRADING: "false"

secretEnv: {}

ltiSyncDrain:
  # Single-instance retry for stuck LtiGradeSync rows, standing in for the
  # in-process scheduler (ENABLE_LTI_SCHEDULER=false). Disable once the
  # scheduler race is fixed and the in-process path is re-enabled.
  enabled: true
  schedule: "*/5 * * * *"
  concurrency: 2
  apiBase: "http://mark-api/api"
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
