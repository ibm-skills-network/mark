---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mark-jobs.fullname" . }}-config
  annotations: {{- include "mark-jobs.install-first.annotations" . | nindent 4 }}
data:
  # GRADING_LTI_GATEWAY_URL is required for in-process grade callbacks
  # when JOBS_EXECUTE_LOCALLY=true. The chart deliberately does not
  # provide a default: the correct service hostname depends on the
  # deployment topology (subchart-under-same-release vs separate
  # release in same namespace), and a silent wrong default has
  # previously caused full LMS sync outages — every PUT fails DNS,
  # rows pile up in LtiGradeSync, retry budgets burn, and student
  # grades land hours late or in FAILED state. Set it explicitly in
  # the overlay, e.g. `http://mark-lti-gateway/grade`.
  GRADING_LTI_GATEWAY_URL: {{ required "env.GRADING_LTI_GATEWAY_URL must be set in the overlay (e.g. http://mark-lti-gateway/grade)" .Values.env.GRADING_LTI_GATEWAY_URL | quote }}
{{- range $name, $value := .Values.env }}
{{- if ne $name "GRADING_LTI_GATEWAY_URL" }}
  {{ $name }}: {{ $value | quote }}
{{- end }}
{{- end }}
