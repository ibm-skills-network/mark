---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mark-jobs.fullname" . }}-config
  annotations: {{- include "mark-jobs.install-first.annotations" . | nindent 4 }}
data:
  # GRADING_LTI_GATEWAY_URL is required for in-process grade callbacks
  # when JOBS_EXECUTE_LOCALLY=true. If the overlay doesn't set it we
  # fall back to the standard cluster-local hostname derived from the
  # Helm release name (the lti-gateway subchart names its service
  # `<release>-lti-gateway`). This default prevents the failure mode
  # where the deploy overlay enables in-process grading but forgets to
  # also set the gateway URL — every grade callback then fails with
  # axios `Invalid URL` and rows pile up in LtiGradeSync as SCHEDULED.
  GRADING_LTI_GATEWAY_URL: {{ .Values.env.GRADING_LTI_GATEWAY_URL | default (printf "http://%s-lti-gateway/grade" .Release.Name) | quote }}
{{- range $name, $value := .Values.env }}
{{- if ne $name "GRADING_LTI_GATEWAY_URL" }}
  {{ $name }}: {{ $value | quote }}
{{- end }}
{{- end }}
