---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mark-jobs.fullname" . }}
  labels:
    {{- include "mark-jobs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mark-jobs.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
      labels:
        {{- include "mark-jobs.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        {{- include "mark-jobs.imagePullSecrets" . | nindent 8 }}
      containers:
        - name: {{ include "mark-jobs.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "mark-jobs.fullname" . }}-config
            - secretRef:
                name: {{ include "mark-jobs.fullname" . }}-secrets
