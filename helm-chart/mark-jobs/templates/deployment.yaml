---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mark-jobs.fullname" . }}
  labels:
    {{- include "mark-jobs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mark-jobs.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
      labels:
        {{- include "mark-jobs.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        {{- include "mark-jobs.imagePullSecrets" . | nindent 8 }}
      containers:
        - name: {{ include "mark-jobs.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "mark-jobs.fullname" . }}-config
            - secretRef:
                name: {{ include "mark-jobs.fullname" . }}-secrets
          # The jobs app is a context-only BullMQ worker with no HTTP server,
          # so liveness is an exec check on the local heartbeat file the worker
          # rewrites every ~10s (DEFAULT_JOB_WORKER_LIVENESS_FILE — keep the
          # path below in sync). The file is written independently of Redis, so
          # only a wedged event loop or a dead process lets it age past 2 min
          # (~12 missed ticks). No readinessProbe: a queue worker pulls its own
          # work and serves no inbound traffic, so there is nothing to gate.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -n "$(find /tmp/mark-jobs-worker.heartbeat -mmin -2 2>/dev/null)"
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
