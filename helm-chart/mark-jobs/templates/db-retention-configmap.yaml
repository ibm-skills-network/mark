{{- if .Values.dbRetention.enabled }}
---
# The script is packaged with the chart: a change to files/db-retention.js only reaches a cluster with a chart version bump.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mark-jobs.fullname" . }}-db-retention-script
  labels:
    {{- include "mark-jobs.labels" . | nindent 4 }}
data:
{{ (.Files.Glob "files/db-retention.js").AsConfig | indent 2 }}
{{- end }}
