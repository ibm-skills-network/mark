{{- if .Values.ltiSyncDrain.enabled }}
---
# The script is packaged with the chart: a change to files/lti-sync-drain.js only reaches a cluster with a chart version bump.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mark-jobs.fullname" . }}-lti-sync-drain-script
  labels:
    {{- include "mark-jobs.labels" . | nindent 4 }}
data:
{{ (.Files.Glob "files/lti-sync-drain.js").AsConfig | indent 2 }}
{{- end }}
