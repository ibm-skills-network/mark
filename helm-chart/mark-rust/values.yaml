# Rust API and worker. Installed as its own release next to the `mark` release in the same namespace;
# helmfile orders it after `mark` (`needs`), so the TypeScript API it depends on always lands first.

global:
  imagePullSecrets:
    - name: icr-global

# Pod selector labels are immutable. The Deployments were adopted from the `mark` release, whose
# selector carried `app.kubernetes.io/instance: mark`; keep that value so the adoption is a no-op.
selectorInstance: mark

# The TypeScript API in the same namespace: the grading hand-off target and the source of shared
# settings (job-queue secret, learner buckets, LTI gateway URL, AI switches).
api:
  name: mark-api
  port: 80
  containerPort: 3000
  # Defaults to <name>-secrets and <name>-config.
  secretName: ""
  configMapName: ""

# The gateway that may call the Rust API (network policy ingress).
apiGateway:
  name: mark-api-gateway

postgres:
  username: ""
  password: ""
  hostname: ""
  port: 5432
  dbName: mark

rustApi:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/ibm-skills-network/mark/mark-rust-api
    tag: ""
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  # Node drains and rollouts keep at least this many pods serving.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    initialDelaySeconds: 5
    timeoutSeconds: 1
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 5
    timeoutSeconds: 3
    periodSeconds: 10
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}
  config:
    LOG_FORMAT: "json"
    RUST_LOG: "info"
    SERVICE_NAME: "mark-rust-api"
    # Execution switches; keep "false" until the Rust path is cut over.
    MARK_RUST_ACCEPT_OPERATIONS: "false"
    MARK_RUST_CONSUME_WORK: "false"
    MARK_RUST_DISPATCH_EXTERNAL_EFFECTS: "false"
    # Lowest x-mark-internal-contract the TypeScript API may answer; older answers get a retryable 503.
    MARK_INTERNAL_CONTRACT_MIN: "1"
    # Defaults: MARK_INTERNAL_API_URL = the api Service; JOB_QUEUE_SECRET and IBM_COS_LEARNER_BUCKET(_PROD)
    # from the api Secret; GRADING_LTI_GATEWAY_URL and the AI switches from the api ConfigMap.
  secrets:
    # Built from the postgres values when empty.
    DATABASE_URL: ""

rustWorker:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/ibm-skills-network/mark/mark-rust-worker
    tag: ""
    pullPolicy: IfNotPresent
  containerPort: 8081
  # A single worker may be evicted for a drain; work is leased, not lost.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    initialDelaySeconds: 5
    timeoutSeconds: 1
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 5
    timeoutSeconds: 3
    periodSeconds: 10
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}
  config:
    LOG_FORMAT: "json"
    RUST_LOG: "info"
    SERVICE_NAME: "mark-rust-worker"
    # Execution switches; keep "false" until the Rust path is cut over.
    MARK_RUST_ACCEPT_OPERATIONS: "false"
    MARK_RUST_CONSUME_WORK: "false"
    MARK_RUST_DISPATCH_EXTERNAL_EFFECTS: "false"
  secrets:
    DATABASE_URL: ""
