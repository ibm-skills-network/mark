{{- if .Values.rustApi.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mark-rust.api.name" . }}-config
  labels:
    {{- include "mark-rust.api.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.rustApi.containerPort | quote }}
{{- if not (hasKey .Values.rustApi.config "MARK_INTERNAL_API_URL") }}
  MARK_INTERNAL_API_URL: {{ printf "http://%s:%v" .Values.api.name .Values.api.port | quote }}
{{- end }}
{{- range $name, $value := .Values.rustApi.config }}
{{- if ne $name "PORT" }}
  {{ $name }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
{{- end }}
