{{- if and .Values.rustApi.enabled .Values.rustApi.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mark-rust.api.name" . }}
  labels:
    {{- include "mark-rust.api.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.rustApi.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "mark-rust.api.selectorLabels" . | nindent 6 }}
{{- end }}
