{{- if .Values.rustApi.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mark-rust.api.name" . }}-secrets
  labels:
    {{- include "mark-rust.api.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.rustApi.secrets.DATABASE_URL | default (include "mark-rust.databaseUrl" .) | quote }}
{{- range $name, $value := .Values.rustApi.secrets }}
{{- if ne $name "DATABASE_URL" }}
  {{ $name }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
{{- end }}
