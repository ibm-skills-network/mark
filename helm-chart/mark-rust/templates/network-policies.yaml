{{- if .Values.rustApi.enabled }}
# Rust API: ingress from the api-gateway only; egress to postgres, the TypeScript API (grading queue)
# and the lti-gateway (grade passback). Kubelet probes are node traffic and need no rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mark-rust.api.name" . }}-policy
  labels:
    {{- include "mark-rust.api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mark-rust.api.selectorLabels" . | nindent 6 }}
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: {{ .Values.apiGateway.name }}
      ports:
      - protocol: TCP
        port: {{ .Values.rustApi.containerPort }}
  egress:
    - to:
      - namespaceSelector:
          matchLabels:
            name: apps-postgres
        podSelector:
          matchLabels:
            app.kubernetes.io/name: apps-postgres-pgbouncer
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: {{ .Values.api.name }}
      ports:
      - protocol: TCP
        port: {{ .Values.api.containerPort }}
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: lti-gateway
  policyTypes:
  - Ingress
  - Egress
---
{{- end }}
{{- if .Values.rustWorker.enabled }}
# Rust worker: no ingress; egress to postgres only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mark-rust.worker.name" . }}-policy
  labels:
    {{- include "mark-rust.worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mark-rust.worker.selectorLabels" . | nindent 6 }}
  egress:
    - to:
      - namespaceSelector:
          matchLabels:
            name: apps-postgres
        podSelector:
          matchLabels:
            app.kubernetes.io/name: apps-postgres-pgbouncer
  policyTypes:
  - Ingress
  - Egress
{{- end }}
