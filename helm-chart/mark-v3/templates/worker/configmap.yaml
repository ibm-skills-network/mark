{{- if .Values.v3Worker.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mark-v3.worker.name" . }}-config
  labels:
    {{- include "mark-v3.worker.labels" . | nindent 4 }}
data:
  WORKER_HEALTH_PORT: {{ .Values.v3Worker.containerPort | quote }}
{{- range $name, $value := .Values.v3Worker.config }}
{{- if ne $name "WORKER_HEALTH_PORT" }}
  {{ $name }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
{{- end }}
