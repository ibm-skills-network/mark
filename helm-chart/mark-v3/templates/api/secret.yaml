{{- if .Values.v3Api.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mark-v3.api.name" . }}-secrets
  labels:
    {{- include "mark-v3.api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Not `default`: it would evaluate the built URL and its `required` checks eagerly. */}}
  {{- if .Values.v3Api.secrets.DATABASE_URL }}
  DATABASE_URL: {{ .Values.v3Api.secrets.DATABASE_URL | quote }}
  {{- else }}
  DATABASE_URL: {{ include "mark-v3.databaseUrl" . | quote }}
  {{- end }}
{{- range $name, $value := .Values.v3Api.secrets }}
{{- if ne $name "DATABASE_URL" }}
  {{ $name }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
{{- end }}
