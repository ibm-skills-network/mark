{{- if and .Values.v3Api.enabled .Values.v3Api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mark-v3.api.name" . }}
  labels:
    {{- include "mark-v3.api.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.v3Api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "mark-v3.api.selectorLabels" . | nindent 6 }}
{{- end }}
