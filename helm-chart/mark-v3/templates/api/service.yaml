{{- if .Values.v3Api.enabled }}
{{- with .Values.v3Api }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mark-v3.api.name" $ }}
  labels:
    {{- include "mark-v3.api.labels" $ | nindent 4 }}
spec:
  type: {{ .service.type }}
  ports:
    - port: {{ .service.port }}
      targetPort: {{ .containerPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "mark-v3.api.selectorLabels" $ | nindent 4 }}
{{- end }}
{{- end }}
