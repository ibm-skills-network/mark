{{- if .Values.v3Api.enabled }}
# v3 API: ingress from the api-gateway only; egress to postgres only. Kubelet probes are node traffic
# and need no rule; DNS is allowed by the cluster-wide policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mark-v3.api.name" . }}-policy
  labels:
    {{- include "mark-v3.api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mark-v3.api.selectorLabels" . | nindent 6 }}
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: {{ .Values.apiGateway.name }}
      ports:
      - protocol: TCP
        port: {{ .Values.v3Api.containerPort }}
  egress:
    - to:
      - namespaceSelector:
          matchLabels:
            name: apps-postgres
        podSelector:
          matchLabels:
            app.kubernetes.io/name: apps-postgres-pgbouncer
  policyTypes:
  - Ingress
  - Egress
---
{{- end }}
{{- if .Values.v3Worker.enabled }}
# v3 worker: no ingress; egress to postgres, HTTPS anywhere (OpenAI, COS) and the lti-gateway (grade passback).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mark-v3.worker.name" . }}-policy
  labels:
    {{- include "mark-v3.worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mark-v3.worker.selectorLabels" . | nindent 6 }}
  egress:
    - to:
      - namespaceSelector:
          matchLabels:
            name: apps-postgres
        podSelector:
          matchLabels:
            app.kubernetes.io/name: apps-postgres-pgbouncer
    - ports:
      - protocol: TCP
        port: 443
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: lti-gateway
  policyTypes:
  - Ingress
  - Egress
{{- end }}
